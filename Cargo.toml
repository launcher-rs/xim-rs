[workspace]
members = [".", "xim-ctext", "xim-gen", "xim-parser"]

[package]
name = "rgpui-xim"
description = "XIM protocol parser, handler"
version = "0.5.0"
repository = "https://github.com/launcher-rs/xim-rs"
documentation = "https://docs.rs/rgpui-xim"
categories = ["no-std", "parser-implementations"]
readme = "README.md"
keywords = ["x11", "xim", "x11rb", "no-std"]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[features]
default = ["std"]

bootstrap-parser = ["xim-parser/bootstrap"]

std = ["xim-parser/std", "ahash/std"]

x11rb-client = ["client", "x11rb", "std"]
xlib-client = ["client", "x11-dl", "std"]

x11rb-server = ["server", "x11rb", "std"]
x11rb-xcb = ["x11rb/allow-unsafe-code", "std"]

# only for internal usage

client = ["dep:log", "dep:xim-ctext", "xim-ctext/std"]
server = ["dep:log"]

[dependencies]
xim-parser = { package = "rgpui-xim-parser", path = "./xim-parser", version = "0.1.0", default-features = false }
xim-ctext = { package = "rgpui-xim-ctext", path = "./xim-ctext", version = "0.1.0", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
ahash = { version = "0.8", default-features = false, features = [
    "compile-time-rng",
] }

x11rb = { version = "0.14", optional = true }
x11-dl = { version = "2.18.5", optional = true }
hashbrown = { version = "0.17.0", default-features = false }

[[example]]
name = "x11rb_client"
path = "examples/x11rb_client.rs"
required-features = ["x11rb-client"]

[[example]]
name = "x11rb_server"
path = "examples/x11rb_server.rs"
required-features = ["x11rb-server"]

[[example]]
name = "xlib_client"
path = "examples/xlib_client.rs"
required-features = ["xlib-client"]

[dev-dependencies]
criterion = "0.8"
pretty_env_logger = "0.5.0"

[[bench]]
name = "rw"
harness = false

[package.metadata.docs.rs]
features = ["x11rb-client", "x11rb-server", "x11rb-xcb", "xlib-client"]
