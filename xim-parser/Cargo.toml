[package]
name = "rgpui-xim-parser"
description = "XIM protocol parser"
version = "0.1.0"
repository = "https://github.com/launcher-rs/xim-rs"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[features]
default = ["std"]
std = []
bootstrap = ["xim-gen"]

[dependencies]
bitflags = { version = "2.4.0", default-features = false }

[dev-dependencies]
xim-ctext = { package = "rgpui-xim-ctext", path = "../xim-ctext", version = "0.1.0" }
pretty_assertions = "1"

[build-dependencies]
xim-gen = { package = "rgpui-xim-gen", path = "../xim-gen", optional = true, version = "0.1.0" }
